[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon_irt"
version = "1.0.0"
description = "Fitting and evaluation library behind 'On the estimation and validity of AI time horizons'"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Exact versions: the shipped artifacts were made with these, and the
# regression tests compare against them at 1e-9.
dependencies = [
    "numpy==2.3.4",
    "scipy==1.16.2",
    "pandas==2.3.3",
    "numba==0.62.1",
    "matplotlib==3.10.7",
    "pyyaml==6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
